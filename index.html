<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Portafolio de Paula Peguero">
<title>Paula Peguero · Portfolio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap">
<style>
/* Layout: soft grey page, one big rounded hero card with a moving strip of work, tile row (one light, two navy), small brand strip, projects grid, process, background, navy contact card */
:root{
  --bg:#F2F2F4; --surface:#FFFFFF; --tint:#E6E5F3; --ink:#1F1C2E; --muted:#6B6879; --line:#E1E0E7;
  --navy:#262338; --on-navy:#F1F0F7; --accent:#6E6BC7; --scrim:rgba(31,28,46,.5);
  --font:"Plus Jakarta Sans","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121119; --surface:#1B1A24; --tint:#262439; --ink:#EDECF4; --muted:#A3A0B2; --line:#2C2A38;
  --navy:#2B2842; --on-navy:#F1F0F7; --accent:#A9A6F2; --scrim:rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121119; --surface:#1B1A24; --tint:#262439; --ink:#EDECF4; --muted:#A3A0B2; --line:#2C2A38;
  --navy:#2B2842; --on-navy:#F1F0F7; --accent:#A9A6F2; --scrim:rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body.locked{overflow:hidden}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
h1,h2,h3{font-weight:500;letter-spacing:-.025em;text-wrap:balance;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px;display:flex;flex-direction:column;gap:88px}
.label{font-size:13px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:14px;font-weight:500;background:var(--navy);color:var(--on-navy);border:0;border-radius:999px;padding:9px 20px;text-decoration:none;cursor:pointer;white-space:nowrap}
.pill:hover{opacity:.9}
/* nav */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;text-decoration:none}
.brand i{width:28px;height:28px;border-radius:50%;background:var(--navy);color:var(--on-navy);font-style:normal;font-size:11px;font-weight:600;display:grid;place-items:center;letter-spacing:.02em}
.links{display:flex;gap:28px;font-size:14px}
.links a{text-decoration:none;color:var(--ink)}
.links a:hover{color:var(--accent)}
.right{display:flex;align-items:center;gap:10px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.lang button{font:inherit;font-size:12px;font-weight:600;border:0;background:none;color:var(--muted);border-radius:999px;padding:4px 10px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
/* hero */
.hero{background:var(--tint);border-radius:24px;overflow:hidden;display:flex;flex-direction:column;align-items:center;text-align:center;padding-block:clamp(56px,9vw,104px);padding-inline:16px;gap:20px}
.hero .mark{font-size:22px;color:var(--ink);line-height:1}
.hero h1{font-size:clamp(44px,8vw,84px);line-height:1}
.hero p{margin:0;max-width:46ch;color:var(--ink);opacity:.8;font-size:clamp(15px,1.8vw,17px);padding-inline:16px}
.strip{width:100%;overflow:hidden;margin-top:clamp(28px,5vw,48px);padding-bottom:clamp(20px,3vw,32px);-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.strip ul{list-style:none;margin:0;padding:0;display:flex;gap:16px;width:max-content;animation:scroll 60s linear infinite}
.strip li{width:clamp(200px,24vw,280px);aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:var(--surface);flex:none}
.strip img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes scroll{to{transform:translateX(calc(-50% - 8px))}}
/* intro */
.intro{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px;align-items:start}
.intro h2{font-size:clamp(34px,5vw,52px);line-height:1.05;margin-bottom:24px}
.intro .say{font-size:clamp(20px,2.4vw,26px);line-height:1.35;letter-spacing:-.01em;margin:0}
.intro .more{display:flex;flex-direction:column;gap:14px;margin-top:20px;color:var(--muted)}
.intro .more p{margin:0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:28px}
.stat{border-top:1px solid var(--line);padding-top:12px}
.stat b{display:block;font-size:clamp(30px,4vw,40px);font-weight:500;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.stat span{display:block;margin-top:6px;font-size:13px;color:var(--muted)}
.about{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:clamp(24px,5vw,56px);align-items:start}
.photo{aspect-ratio:4/5;max-width:100%;border-radius:20px;overflow:hidden;background:var(--tint)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.txt{display:flex;flex-direction:column;gap:16px;max-width:62ch;min-width:0}
.txt p{margin:0;font-size:17px;color:var(--ink)}
.txt .stats{margin-top:12px}
/* tiles */
.tiles{display:grid;grid-template-columns:2fr 1fr 1fr;gap:16px}
.tile{border-radius:20px;padding:24px;min-height:260px;display:flex;flex-direction:column;justify-content:space-between;gap:24px;min-width:0}
.tile h3{font-size:clamp(20px,2.2vw,24px);line-height:1.2}
.tile p{margin:0;font-size:14px;max-width:34ch}
.tile.light{background:var(--tint)}
.tl{display:flex;flex-direction:column;gap:16px}
.tile.light p.motto{font-size:clamp(22px,2.6vw,30px);line-height:1.3;letter-spacing:-.015em;color:var(--ink);max-width:28ch;margin:0}
.tile.light p{color:var(--muted)}
.tile.dark{background:var(--navy);color:var(--on-navy)}
.tile.dark p{opacity:.75}
.tiles .eyebrow{grid-column:1/-1;font-size:13px;color:var(--muted);margin-bottom:-4px}
/* brands */
.brands{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:24px;align-items:center;margin-top:-48px}
.brands .label{font-size:12px;line-height:1.4}
.marquee{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.track{list-style:none;margin:0;padding:0;display:flex;width:max-content;animation:scroll 30s linear infinite}
.track li{padding-right:48px;white-space:nowrap;font-weight:600;font-size:17px;letter-spacing:-.01em;color:var(--muted);opacity:.8}
.marquee:hover .track,.strip:hover ul{animation-play-state:paused}
/* section heads */
.shead{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:end;margin-bottom:28px}
.shead .label{display:block;margin-bottom:6px}
.shead h2{font-size:clamp(34px,5vw,52px);line-height:1.05}
.shead p{margin:0;color:var(--muted);max-width:40ch;justify-self:end}
/* projects */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.proj{all:unset;cursor:pointer;display:flex;flex-direction:column;background:var(--surface);border-radius:20px;overflow:hidden;min-width:0}
.proj:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.cover{aspect-ratio:4/3;width:100%;max-width:100%;overflow:hidden;position:relative;background:var(--tint)}
.cover img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
.cover.fit img{object-fit:contain;padding:16px}
.proj:hover .cover img{transform:scale(1.03)}
.play{position:absolute;left:12px;top:12px;background:var(--navy);color:var(--on-navy);font-size:11px;font-weight:600;letter-spacing:.04em;border-radius:999px;padding:4px 10px}
.pbody{padding:16px 20px 20px;display:flex;flex-direction:column;gap:6px}
.proj h3{font-size:18px;line-height:1.3}
.meta{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted)}
.meta .go{color:var(--ink);font-weight:500}
/* process */
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;counter-reset:st}
.steps li{counter-increment:st;background:var(--surface);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:8px;min-width:0}
.steps li::before{content:counter(st,decimal-leading-zero);width:32px;height:32px;border-radius:50%;background:var(--tint);display:grid;place-items:center;font-size:12px;font-weight:600;margin-bottom:8px}
.steps b{font-weight:500;font-size:17px}
.steps p{margin:0;color:var(--muted);font-size:14px}
/* background */
.cv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.cvcol{background:var(--surface);border-radius:20px;padding:24px}
.cvcol h3{font-size:20px;margin-bottom:8px}
.item{display:grid;grid-template-columns:80px minmax(0,1fr);gap:12px;padding-block:14px;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item .when{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.item b{display:block;font-weight:500}
.item p{margin:2px 0 0;color:var(--muted);font-size:14px}
.item ul{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:14px}
.item li{margin-top:4px}
/* contact */
.contact{background:var(--navy);color:var(--on-navy);border-radius:24px;padding:clamp(28px,6vw,64px);display:flex;flex-direction:column;align-items:flex-start;gap:20px}
.contact .label{color:inherit;opacity:.7}
.contact h2{font-size:clamp(36px,6vw,64px);line-height:1}
.mail{display:flex;flex-wrap:wrap;align-items:center;gap:12px;font-size:18px}
.mail code{font-family:var(--font);user-select:all}
.contact .pill{background:var(--on-navy);color:var(--navy)}
.ghost{border:1px solid currentColor;border-radius:999px;padding:8px 18px;text-decoration:none;font-size:14px;font-weight:500}
footer{font-size:13px;color:var(--muted);text-align:center;margin-top:-56px}
/* viewer */
.viewer{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;justify-content:center;overflow-y:auto;overscroll-behavior:contain}
.sheet{background:var(--bg);width:min(1100px,100%);min-height:100%;display:flex;flex-direction:column}
.bar{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar h2{font-size:clamp(20px,3vw,26px)}
.bar .label{display:block}
.nav{display:flex;gap:8px;flex-shrink:0}
.nav button{font:inherit;font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer}
.nav button.close{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.shots{display:flex;flex-direction:column;padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
.shots img{display:block;width:100%;height:auto;background:var(--surface)}
.shots.video{gap:16px;padding-top:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.note{margin:0;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));color:var(--muted)}
.shots.video .note{padding:0}
.vbox{background:var(--surface);border-radius:20px;padding:clamp(12px,3vw,32px);display:flex;justify-content:center}
.vbox video{display:block;max-width:100%;max-height:78vh;height:auto;border-radius:8px}
.end{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.end button{font:inherit;font-weight:500;background:none;border:0;color:var(--ink);cursor:pointer;padding:0}
@media (max-width:900px){.links{display:none}.tiles{grid-template-columns:1fr 1fr}.tile.light{grid-column:1/-1}.steps{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.shead,.cv,.brands{grid-template-columns:1fr}.shead p{justify-self:start}.tiles{grid-template-columns:1fr}.about{grid-template-columns:1fr}.photo{max-width:260px}.tile{min-height:0}.steps{grid-template-columns:1fr}.item{grid-template-columns:1fr;gap:2px}.nav .prev,.nav .next{display:none}.right .pill{display:none}.brands{margin-top:-56px;gap:8px}.wrap{gap:72px}}
@media (prefers-reduced-motion:reduce){.strip ul,.track{animation:none}.cover img{transition:none}html{scroll-behavior:auto}}

.gate{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding-block:48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gate form{width:100%;max-width:380px;display:flex;flex-direction:column;gap:20px}
.gate h1{font-size:clamp(44px,10vw,64px)}
.gate p{margin:0;color:var(--muted)}
.gate .row{display:flex;gap:8px}
.gate input{flex:1;min-width:0;font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:2px;background:var(--surface);color:var(--ink)}
.gate input:focus{outline:2px solid var(--accent);outline-offset:1px}
.gate button{font:inherit;font-weight:500;background:var(--ink);color:var(--bg);border:0;border-radius:2px;padding:12px 18px;cursor:pointer}
.gate .err{color:var(--accent);font-size:14px;min-height:1.4em}
</style>
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>

<main class="gate" id="gate"><form id="gf" autocomplete="off">

<h1>Paula<br><span>Peguero</span></h1>
<p>Este portafolio es privado. Escribe la clave para entrar.<br>This portfolio is private. Enter the password to continue.</p>
<div class="row"><input id="pw" type="password" aria-label="Clave / Password" placeholder="Clave / Password" autofocus><button type="submit">Entrar</button></div>
<div class="err" id="err" role="alert"></div>
</form></main>

function u(b){return Uint8Array.from(atob(b),function(c){return c.charCodeAt(0)})}
async function unlock(p){
  var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);
  var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},k,u(D.c));
  var o=JSON.parse(new TextDecoder().decode(pt));
  document.getElementById('gate').remove();
  document.getElementById('app').innerHTML=o.html;
  var sc=document.createElement('script');sc.textContent=o.js;document.body.appendChild(sc);
  try{sessionStorage.setItem('pk',p)}catch(e){}
}
document.getElementById('gf').addEventListener('submit',function(e){
  e.preventDefault();var p=document.getElementById('pw').value,er=document.getElementById('err');
  er.textContent='';unlock(p).catch(function(){er.textContent='Clave incorrecta. Incorrect password.';document.getElementById('pw').select()});
});
try{var sp=sessionStorage.getItem('pk');if(sp)unlock(sp).catch(function(){})}catch(e){}
