<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Portafolio de Paula Peguero: diseño, branding, ad tech e ilustración.">
<title>Paula Peguero · Portfolio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Manrope:wght@400;500;600&display=swap">
<style>
/* Layout: big name, grid of project covers that open each project in place, then a compact CV band and contact */
:root{
  --bg:#F4F1EE; --surface:#FBF9F7; --ink:#2B2624; --muted:#786D67; --line:#E2DCD7;
  --accent:#9C5A5A; --accent-ink:#FFFFFF; --scrim:rgba(43,38,36,.5);
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --body:"Manrope", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1A1716; --surface:#231F1D; --ink:#EDE7E3; --muted:#A89D97; --line:#362F2C;
  --accent:#D49A97; --accent-ink:#1A1716; --scrim:rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1A1716; --surface:#231F1D; --ink:#EDE7E3; --muted:#A89D97; --line:#362F2C;
  --accent:#D49A97; --accent-ink:#1A1716; --scrim:rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
body.locked{overflow:hidden}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:48px 64px;display:flex;flex-direction:column;gap:72px}
a{color:inherit}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
header{display:flex;flex-direction:column;gap:20px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.lang button{font:inherit;font-size:13px;font-weight:600;letter-spacing:.06em;border:0;background:none;color:var(--muted);border-radius:999px;padding:4px 12px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
h1{font-size:clamp(52px,11vw,124px);line-height:.95;font-weight:300;letter-spacing:-.025em}
h1 span{color:var(--accent)}
.lede{font-size:clamp(17px,2vw,20px);max-width:42ch;margin:0;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px;color:var(--muted)}
.brands{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:20px;margin-top:12px}
.marquee{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.track{list-style:none;margin:0;padding:0;display:flex;width:max-content;animation:scroll 28s linear infinite}
.marquee:hover .track{animation-play-state:paused}
.track li{padding-right:clamp(32px,5vw,64px);white-space:nowrap}
@keyframes scroll{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.track{animation:none;flex-wrap:wrap;width:auto}.track li[aria-hidden]{display:none}}
.brands li{font-family:var(--display);font-weight:400;font-size:clamp(20px,3vw,30px);letter-spacing:-.01em;color:var(--muted)}
section{display:flex;flex-direction:column;gap:24px}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px}
h2{font-size:clamp(28px,4vw,40px);font-weight:400;letter-spacing:-.01em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:28px}
.proj{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:12px;min-width:0}
.cover{aspect-ratio:4/3;max-width:100%;width:100%;border-radius:2px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.cover img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s ease}
.proj:hover .cover img{transform:scale(1.035)}
.proj:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:6px}
.proj h3{font-size:20px;font-weight:400}
.meta{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--muted)}
.meta .go{color:var(--accent);font-weight:500}
.cv{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:40px}
.cv h3{font-size:22px;font-weight:400;margin-bottom:16px}
.item{display:grid;grid-template-columns:96px 1fr;gap:12px;padding-block:12px;border-top:1px solid var(--line)}
.item:last-child{border-bottom:1px solid var(--line)}
.item .when{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.item b{display:block;font-weight:500}
.item p{margin:2px 0 0;color:var(--muted);font-size:15px;min-width:0}
.contact{background:var(--ink);color:var(--bg);border-radius:2px;padding:clamp(24px,5vw,48px);display:flex;flex-direction:column;gap:20px}
.contact h2{font-size:clamp(34px,6vw,56px);font-weight:300}
.contact .label{color:inherit;opacity:.7}
.links{display:flex;flex-wrap:wrap;gap:12px}
.links a{border:1px solid currentColor;border-radius:999px;padding:8px 18px;text-decoration:none;font-weight:500}
.links a:hover{background:var(--bg);color:var(--ink)}
.mail{display:flex;flex-wrap:wrap;align-items:center;gap:12px;font-size:18px}
.mail code{font-family:var(--body);user-select:all}
.mail button{font:inherit;font-size:14px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:6px 14px;cursor:pointer}

/* project view */
.viewer{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;justify-content:center;overflow-y:auto;overscroll-behavior:contain}
.sheet{background:var(--bg);width:min(1100px,100%);min-height:100%;display:flex;flex-direction:column}
.bar{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar h2{font-size:clamp(20px,3vw,26px)}
.bar .label{display:block;margin-bottom:2px}
.nav{display:flex;gap:8px;flex-shrink:0}
.nav button{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer}
.nav button.close{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.shots{display:flex;flex-direction:column;padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
.shots img{display:block;width:100%;height:auto;background:var(--surface)}
.shots.video{gap:24px;padding-top:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.note{margin:0;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));color:var(--muted)}
.shots.video .note{padding:0}
.vbox{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:clamp(12px,3vw,32px);display:flex;justify-content:center}
.vbox video{display:block;max-width:100%;max-height:78vh;height:auto;border-radius:4px}
.cover{position:relative}
.cover.fit img{object-fit:contain;padding:12px}
.play{position:absolute;left:12px;bottom:12px;background:var(--ink);color:var(--bg);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:4px 10px}
.end{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.end button{font:inherit;font-weight:600;background:none;border:0;color:var(--accent);cursor:pointer;padding:0}
@media (prefers-reduced-motion:reduce){.cover img{transition:none}.proj:hover .cover img{transform:none}}
@media (max-width:480px){.item{grid-template-columns:1fr;gap:2px}.nav .prev,.nav .next{display:none}}

.gate{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding-block:48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gate form{width:100%;max-width:380px;display:flex;flex-direction:column;gap:20px}
.gate h1{font-size:clamp(44px,10vw,64px)}
.gate p{margin:0;color:var(--muted)}
.gate .row{display:flex;gap:8px}
.gate input{flex:1;min-width:0;font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:2px;background:var(--surface);color:var(--ink)}
.gate input:focus{outline:2px solid var(--accent);outline-offset:1px}
.gate button{font:inherit;font-weight:500;background:var(--ink);color:var(--bg);border:0;border-radius:2px;padding:12px 18px;cursor:pointer}
.gate .err{color:var(--accent);font-size:14px;min-height:1.4em}
</style>
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<main class="gate" id="gate"><form id="gf" autocomplete="off">
<span class="label">Portfolio</span>
<h1>Paula<br><span>Peguero</span></h1>
<p>Este portafolio es privado. Escribe la clave para entrar.<br>This portfolio is private. Enter the password to continue.</p>
<div class="row"><input id="pw" type="password" aria-label="Clave / Password" placeholder="Clave / Password" autofocus><button type="submit">Entrar</button></div>
<div class="err" id="err" role="alert"></div>
</form></main>

function u(b){return Uint8Array.from(atob(b),function(c){return c.charCodeAt(0)})}
async function unlock(p){
  var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);
  var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},k,u(D.c));
  var o=JSON.parse(new TextDecoder().decode(pt));
  document.getElementById('gate').remove();
  document.getElementById('app').innerHTML=o.html;
  var sc=document.createElement('script');sc.textContent=o.js;document.body.appendChild(sc);
  try{sessionStorage.setItem('pk',p)}catch(e){}
}
document.getElementById('gf').addEventListener('submit',function(e){
  e.preventDefault();var p=document.getElementById('pw').value,er=document.getElementById('err');
  er.textContent='';unlock(p).catch(function(){er.textContent='Clave incorrecta. Incorrect password.';document.getElementById('pw').select()});
});
try{var sp=sessionStorage.getItem('pk');if(sp)unlock(sp).catch(function(){})}catch(e){}
